server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/connect
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
  application:
    name: "cards"
  config:
    import: "configserver:http://localhost:8071"
  profiles:
    active: "prod"
  rabbitmq:
    host: "localhost"
    port: "5672"
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
