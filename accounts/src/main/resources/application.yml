server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/connect
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
  config:
    import:
      - "application_qa.yml"
      - "application_prod.yml"
  profiles:
    active: "qa"
    
build:
  version: "3.0"

accounts:
  message: "Welcome to microservices"
  contactDetails:
    name: "John"
    email: "john@example.com"
  onCallSupport:
    - (555)555-1234
    - (555)555-1236